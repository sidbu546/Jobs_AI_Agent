[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jobs-ai-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-community>=0.3.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.0",
    "chromadb>=0.5.0",
    "streamlit>=1.36.0",
    "playwright>=1.44.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "tiktoken>=0.7.0",
    "anthropic>=0.30.0",
    "mcp>=1.2.0",
    "tenacity>=8.5.0",
    "aiofiles>=24.1.0",
    "rich>=13.7.0",
    "sentence-transformers>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["core", "ingestion", "candidate", "match", "tailor", "draft", "fill", "orchestrator", "eval", "app", "mcp_servers", "outreach"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
